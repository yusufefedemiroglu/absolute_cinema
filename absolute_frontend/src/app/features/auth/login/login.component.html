<div class="creative-bg">
  <div class="floating-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
  </div>
</div>

<div class="login-container">
  <div class="login-card" #card>
    <div class="card-decoration">
      <div class="deco-line line-1"></div>
      <div class="deco-line line-2"></div>
      <div class="deco-line line-3"></div>
    </div>

    <div class="login-header">
      <div class="creative-logo">
        <div class="logo-circle circle-1"></div>
        <div class="logo-circle circle-2"></div>
        <div class="logo-circle circle-3"></div>
      </div>
      <h2>Admin Panel</h2>
      <p>Login</p>
    </div>

    <form class="login-form" id="loginForm" novalidate [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group" [class.error]="isInvalid('userNameOrEmail')">
        <div class="input-wrapper">
          <div class="input-decoration"></div>

          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            formControlName="userNameOrEmail"
          />

          <label for="email">Email Address</label>

          <div class="input-waves">
            <div class="wave wave-1"></div>
            <div class="wave wave-2"></div>
            <div class="wave wave-3"></div>
          </div>
        </div>

        <span class="error-message" id="emailError" [class.show]="isInvalid('userNameOrEmail')">
          {{ isInvalid('userNameOrEmail') ? getErrorMessage('userNameOrEmail') : '' }}
        </span>
      </div>

      <div class="form-group" [class.error]="isInvalid('password')">
        <div class="input-wrapper password-wrapper">
          <div class="input-decoration"></div>

          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            formControlName="password"
          />

          <label for="password">Password</label>

          <button
            type="button"
            class="password-toggle"
            id="passwordToggle"
            aria-label="Toggle password visibility"
            (click)="togglePassword()"
          >
            <span class="toggle-icon" [class.show-password]="showPassword"></span>
          </button>

          <div class="input-waves">
            <div class="wave wave-1"></div>
            <div class="wave wave-2"></div>
            <div class="wave wave-3"></div>
          </div>
        </div>

        <span class="error-message" id="passwordError" [class.show]="isInvalid('password')">
          {{ isInvalid('password') ? getErrorMessage('password') : '' }}
        </span>
      </div>

      <div class="form-options">
        <div class="remember-wrapper">
          <input type="checkbox" id="remember" name="remember" formControlName="remember" />
          <label for="remember" class="checkbox-label">
            <div class="checkbox-creative">
              <div class="check-mark"></div>
            </div>
            Stay signed in
          </label>
        </div>

        <a href="#" class="forgot-password" (click)="$event.preventDefault()"
          >Forgot your password?</a
        >
      </div>

      <button type="submit" class="login-btn" [class.loading]="isLoading" [disabled]="isLoading">
        <span class="btn-bg"></span>
        <span class="btn-text">Login</span>
        <span class="btn-loader">
          <div class="loader-dot dot-1"></div>
          <div class="loader-dot dot-2"></div>
          <div class="loader-dot dot-3"></div>
        </span>
      </button>
    </form>

    <div class="success-message" id="successMessage" [class.show]="showSuccess">
      <div class="success-animation">
        <div class="success-circle"></div>
        <div class="success-checkmark">✓</div>
      </div>
      <h3>Welcome, Creator!</h3>
      <p>Entering your creative dimension...</p>
    </div>
  </div>
</div>
