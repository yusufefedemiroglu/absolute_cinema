<div class="auth-page">
  <!-- Background -->
  <div class="creative-bg">
    <div class="floating-shapes" #shapeLayer>
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
      <div class="shape shape-5"></div>
    </div>
  </div>

  <!-- Container -->
  <div class="login-container">
    <!-- add class "show-register" here to show register UI -->
    <div class="login-card" #card>
      <!-- Decoration -->
      <div class="card-decoration">
        <div class="deco-line line-1"></div>
        <div class="deco-line line-2"></div>
        <div class="deco-line line-3"></div>
      </div>

      <!-- LOGIN HEADER -->
      <div class="login-header">
        <div class="creative-logo">
          <div class="logo-circle circle-1"></div>
          <div class="logo-circle circle-2"></div>
          <div class="logo-circle circle-3"></div>
        </div>
        <h2>Admin Panel</h2>
        <p>Login</p>
      </div>

      <!-- LOGIN FORM (Angular) -->
      <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <!-- Email -->
        <div class="form-group" [class.error]="isInvalid('userNameOrEmail')">
          <div class="input-wrapper">
            <div class="input-decoration"></div>

            <input type="text" formControlName="userNameOrEmail" required autocomplete="email" />
            <label>Email Address</label>

            <div class="input-waves">
              <div class="wave wave-1"></div>
              <div class="wave wave-2"></div>
              <div class="wave wave-3"></div>
            </div>
          </div>

          <span class="error-message" [class.show]="isInvalid('userNameOrEmail')">
            {{ isInvalid('userNameOrEmail') ? getErrorMessage('userNameOrEmail') : '' }}
          </span>
        </div>

        <!-- Password -->
        <div class="form-group" [class.error]="isInvalid('password')">
          <div class="input-wrapper password-wrapper">
            <div class="input-decoration"></div>

            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              required
              autocomplete="current-password"
            />
            <label>Password</label>

            <button
              type="button"
              class="password-toggle"
              aria-label="Toggle password visibility"
              (click)="togglePassword()"
            >
              <span class="toggle-icon" [class.show-password]="showPassword"></span>
            </button>

            <div class="input-waves">
              <div class="wave wave-1"></div>
              <div class="wave wave-2"></div>
              <div class="wave wave-3"></div>
            </div>
          </div>

          <span class="error-message" [class.show]="isInvalid('password')">
            {{ isInvalid('password') ? getErrorMessage('password') : '' }}
          </span>
        </div>

        <!-- Options -->
        <div class="form-options">
          <div class="remember-wrapper">
            <input type="checkbox" id="remember" formControlName="remember" />
            <label for="remember" class="checkbox-label">
              <div class="checkbox-creative">
                <div class="check-mark">✓</div>
              </div>
              Remember me
            </label>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="login-btn" [class.loading]="isLoading" [disabled]="isLoading">
          <span class="btn-bg"></span>

          <span class="btn-text" *ngIf="!isLoading">Login</span>

          <span class="btn-loader" *ngIf="isLoading">
            <div class="loader-dot dot-1"></div>
            <div class="loader-dot dot-2"></div>
            <div class="loader-dot dot-3"></div>
          </span>
        </button>
      </form>
      <!-- it was for fake login test -->
      <!-- Success overlay --> 
      <div class="success-message" *ngIf="showSuccess">
        <div class="success-animation">
          <div class="success-circle"></div>
          <div class="success-checkmark">✓</div>
        </div>
        <h3>Welcome</h3>
      </div>
    </div>
  </div>
</div>
